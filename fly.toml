app = "agent-passport-hedera"
primary_region = "ams"

# Non-secret feature flags (secrets override [env] on conflict — see
# scripts/set-fly-secrets.sh). SLICE-155-13: agent wallet on prod;
# DATABASE_ENABLED/DATABASE_URL already live as secrets.
[env]
  AGENT_WALLET_ENABLED = "true"
  AGENT_WALLET_CHAIN = "ARC"
  AGENT_WALLET_LEDGER_STORE = "db"

# Migrations run on the temp release machine at deploy time — the dev net
# cannot reach db.prisma.io:5432, but Fly's network can. Assets are vendored
# by deploy.sh into .docker-packages/database (migrations + contract + config).
[deploy]
  release_command = "sh -c 'cd /app/.docker-packages/database && bunx prisma@8.0.0-rc.15 db migrate --advance-ref db'"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  max_machines = 1

[vm]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
