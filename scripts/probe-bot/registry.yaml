# registry.yaml — ручной реестр endpoint'ов, которых нет в openapi/code
# (edge-роуты, ops-ручки). Только безопасные GET — мутирующие ручки
# сюда НЕ добавлять (см. hard-deny в src/safety.ts).
#
# ВНИМАНИЕ: /ops/stats-digest имеет TG-side-effect (шлёт дайджест) —
# сюда его не вносим сознательно.
endpoints:
  - path: /metrics
    method: GET
  - path: /api/ledger/revenue
    method: GET
  - path: /.well-known/x402.json
    method: GET
  # EPIC-258: x402 payout proof — статический well-known + self-scan showcase.
  - path: /.well-known/x402-payto.json
    method: GET
  - path: /agent-readiness.json
    method: GET
  - path: /.well-known/agent-card.json
    method: GET
  # Корень для endpoint-discovery (path-feed сценарий применяется к "/").
  - path: /
    method: GET

  # ── contract-блоки (SLICE-234-40) ────────────────────────────────
  # Семантика endpoint'ов для contract-aware сценариев. Токены:
  # {case_key} — стабильный per-case ид (идемпотентность-дружественный),
  # {run_id} — id прогона, {ts} — unixtime. Секреты — только env,
  # сюда литералами НЕ писать.

  # EPIC-228: agent-interaction intake (async, human-answered).
  # POST {type?,text,context?{sessionId,channel,meta}} +
  # обязательный заголовок idempotency-key → 202 {requestId,status,
  # statusUrl,sessionId}. Public-проекция — GET statusUrl.
  - path: /api/v1/agent/interaction
    method: POST
    contract:
      bodyTemplate:
        type: question
        text: "BOT-PROBE {case_key}: what is the SLA for refunds?"
        context:
          sessionId: "probe-session-{case_key}"
          channel: probe-bot
      idempotencyField: "header:idempotency-key"
      replayInvariant: [requestId, sessionId]
      readPathField: statusUrl
      idField: requestId
      ssrPath: "/admin/interactions/{id}"
      projectionDenylist:
        - context.text
        - operatorNote
        - internalMeta
        - fingerprint
      lifecycleAdmin: /api/admin/interactions
      terminalStates: [ANSWERED, REJECTED]

  # EPIC-229: knowledge ask — POST {query 2..500} → 200 {results,query,
  # tookMs,engine}. Без идемпотентности — negative-contract и
  # mass-assignment применимы, replay — нет.
  - path: /api/v1/agent/knowledge/ask
    method: POST
    contract:
      bodyTemplate:
        query: "BOT-PROBE {case_key}: what is attestcoin?"
      idField: query

  # EPIC-229: knowledge item create (admin). POST {slug?,kind,title,
  # body,summary?} + x-admin-key=<operator cred opk_*> +
  # idempotency-key → 201 {item:{id:"ki_*",slug,status:"DRAFT"},
  # version}. Атрибуция — op_* principal из cred'а (264:
  # x-operator-id мёртв под operatorAuth). lifecycleAdmin
  # НЕ ставим — interaction-lifecycle 228-формы (classify/respond)
  # на нас не распространяется; полный цикл закрывает
  # knowledge-lifecycle (transitions + published-проекция).
  - path: /admin/api/knowledge/items
    method: POST
    contract:
      bodyTemplate:
        slug: "{case_key}"
        kind: FAQ
        title: "BOT-PROBE {case_key} probe item"
        body: "Deterministic probe coverage — BOT-PROBE {case_key}."
        summary: "BOT-PROBE {case_key}"
      idempotencyField: "header:idempotency-key"
      replayInvariant: [item.id]
      idField: item.id
      ssrPath: "/admin/knowledge/items/{id}"
      terminalStates: [WITHDRAWN]

  # EPIC-230: feedback intake — POST {text,kind?,target?,severity?} +
  # обязательный idempotency-key → {id:"fb_*",statusUrl}. Public GET —
  # statusUrl (проекция {id,status,createdAt,updatedAt}).
  - path: /api/v1/agent/feedback
    method: POST
    contract:
      bodyTemplate:
        text: "BOT-PROBE {case_key}: deploy-verify feedback probe"
        kind: OTHER
        target: api
        severity: LOW
      idempotencyField: "header:idempotency-key"
      replayInvariant: [id]
      readPathField: statusUrl
      idField: id
      projectionDenylist:
        - dedupeScope
        - idempotencyKey
        - normalized
        - actorRef
        - fingerprint
        - relatedFeedbackId

  # EPIC-230: review request — POST {reviewType,workRef URI,
  # agentCriteria?,evidence?} + idempotency-key → {id:"rv_*",
  # statusUrl}. workRef должен быть URI (internal:/https://path).
  # Public GET — statusUrl; decisions публичны без criterion note (M9).
  - path: /api/v1/agent/reviews
    method: POST
    contract:
      bodyTemplate:
        reviewType: API_SURFACE
        workRef: "internal:bot-probe-{case_key}"
        agentCriteria:
          - "BOT-PROBE {case_key} deploy-verify"
        evidence:
          - type: ARTIFACT_REF
            uri: "internal:bot-probe-evidence-{case_key}"
            label: "BOT-PROBE {case_key}"
      idempotencyField: "header:idempotency-key"
      replayInvariant: [id]
      readPathField: statusUrl
      idField: id
      projectionDenylist:
        - dedupeScope
        - idempotencyKey
        - assignee
        - fingerprint
        - operatorNote
        - latestDecisionSeq
        - note
