name: error-leak
layer: security
template: contract-basic
apply:
  methods: [GET]
expect:
  status_in: [200, 201, 202, 204, 301, 302, 304, 400, 401, 402, 403, 404, 405, 408, 409, 410, 422, 429]
  body_not_includes:
    - "re:TypeError:|ReferenceError:"
    - "re:at\\s+\\S+\\s+\\(/src/"
    - "re:PrismaClient|pg\\.|ECONNREFUSED"
