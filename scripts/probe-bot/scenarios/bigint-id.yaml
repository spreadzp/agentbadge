# Нечисловые/гигантские ID — /api/attestcoin/tasks/:id звал BigInt() до
# try/catch → 500 на 'taskId' и плейсхолдерах (ZAP: '688 Zaproxy Ridge')
name: bigint-id
layer: security
template: param-variants
dbVerify: true
apply:
  methods: [GET]
  pathRegex: "tasks|jobs|events|items"
params:
  values: ["taskId", "jobId", "id", "99999999999999999999999999",
           "-1", "0", "18446744073709551617", "688 Zaproxy Ridge"]
expect:
  status_in: [400, 401, 402, 403, 404, 405, 422, 429]
  status_not_in: [500, 502, 503, 504]
  body_not_includes: ["BigInt", "Cannot convert", "prisma"]
