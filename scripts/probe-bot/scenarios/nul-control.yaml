# NUL-byte в path-параметре — исторический баг: /api/ledger/events/%00 → 500
# (найден пробой 205.147.22.1 2026-11-20, фикс f00640dd). Regression-pack.
name: nul-control
layer: security
template: param-variants
dbVerify: true          # NUL в payload.path ломал SQL-аналитику — проверяем телеметрию тоже
apply:
  methods: [GET]
params:
  values_file: nul-variants.txt
  values: ["%00", "a%00b", "%00x", "%2500"]
expect:
  status_in: [301, 400, 401, 402, 403, 404, 405, 414, 422, 429]  # 301 = trailing-slash canonicalization: путь не дошёл до обработчика
  status_not_in: [500, 502, 503, 504]
  body_not_includes: ["\u0000", "internal", "prisma", "SELECT"]
