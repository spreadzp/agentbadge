# SQLi-сигнатуры — как в батарее hermes-probes (';DROP--, 0x';DROP--)
name: sqli
layer: security
template: param-variants
apply:
  methods: [GET]
params:
  values: ["';DROP--", "0x';DROP--", "' OR '1'='1", "1;SELECT 1"]
expect:
  status_in: [400, 401, 402, 403, 404, 405, 422, 429]
  status_not_in: [500, 502, 503, 504]
  body_not_includes: ["syntax error", "SQL", "postgres", "SELECT *"]
