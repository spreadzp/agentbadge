# FTS/tsquery-инъекция в ?q= — вектор из SLICE-229-10 (knowledge search).
# tsquery-операторы, NUL-байт (через \x00 → encodeURIComponent → %00),
# unicode, длинный запрос: typed 4xx или честный пустой 200, никогда 500
# и никогда не-PUBLISHED утечка (leak-проверка остаётся у verify-пакета).
name: fts-injection
layer: security
template: query-variants
apply:
  methods: [GET]
  pathRegex: "search|knowledge"
params:
  param: q
  values:
    - "&"
    - "|"
    - "!"
    - ":*"
    - "'"
    - "()"
    - "a <-> b"
    - "\x00"
    - "ключ🔥"
    - "\u202Eadmin"           # bidi override
    - "SELECT * FROM items"
    - ""
expect:
  status_in: [200, 400, 401, 402, 403, 404, 405, 413, 414, 422, 429]
  status_not_in: [500, 502, 503, 504]
  body_not_includes: ["syntax error", "tsquery", "postgres", "SELECT *"]
