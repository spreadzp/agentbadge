# Path traversal — ../../etc/passwd паттерны в path-сегменте
name: traversal
layer: security
template: param-variants
apply:
  methods: [GET]
params:
  values: ["..%2F..%2Fetc%2Fpasswd", "%2e%2e%2f", "..%252F..%252F", "..;/etc/passwd"]
expect:
  status_in: [400, 401, 402, 403, 404, 405, 414, 422, 429]
  status_not_in: [500, 502, 503, 504]
  body_not_includes: ["root:", "/etc/passwd", "daemon:"]
