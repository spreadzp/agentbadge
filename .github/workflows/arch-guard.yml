name: Architecture Guard

# Fails when module imports under src/ change without regenerating
# docs/architecture-graph.md. Keeps the architecture map (ARCHITECTURE.md §5)
# trustworthy — stale maps are worse than none.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/arch-graph.mts"
      - "docs/architecture-graph.md"
      - ".github/workflows/arch-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/arch-graph.mts"
      - "docs/architecture-graph.md"
      - ".github/workflows/arch-guard.yml"
  workflow_dispatch:

jobs:
  graph-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # arch-graph.mts uses only node builtins — no bun install needed.
      - name: Regenerate graph and fail on diff
        run: bun run arch:graph:check
