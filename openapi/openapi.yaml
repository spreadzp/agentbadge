  /api/total-scan:
    post:
      operationId: postApiTotalScan
      tags:
        - API
      summary: Run a full agent readiness scan with SSE streaming
      description: "Streams scan progress and results via Server-Sent Events. Returns
        progress events during fetch/evaluate phases, then a result event with
        the full report, then a done event. Optional `packs: string[]` scopes
        the scan to rule bundles (see GET /api/scan-packs for valid ids; legacy
        pack aliases accepted). Auth: access pass via X-Wallet/X-Sig/X-Timestamp
        (EIP-191 signature over the agentbadge-access:v1 challenge — see
        docs/agent-access.md), or x402 payment."
      parameters:
        - name: X-Wallet
          in: header
          required: false
          schema:
            type: string
          description: Agent wallet address (EOA or ERC-1271 contract wallet) holding a
            valid access pass
        - name: X-Sig
          in: header
          required: false
          schema:
            type: string
          description: EIP-191 signature over the canonical challenge
            (agentbadge-access:v1, wallet, method, path, timestamp)
        - name: X-Timestamp
          in: header
          required: false
          schema:
            type: string
          description: Unix seconds, ±300s skew window — must match the timestamp in the
            signed challenge
      responses:
        "200":
          description: SSE stream of scan progress and results
        "400":
          description: Missing or invalid URL, or unknown bundle ids
        "401":
          description: Missing/invalid auth headers, stale timestamp, or signature
            verification failed
        "402":
          description: "Payment required (x402). PAYMENT-REQUIRED header carries
            base64-encoded payment requirements (accepts: scheme exact, network
            eip155:84532, USDC 0x036CbD53842c5426634e7929541eC2318f3dCF7e,
            atomic amount). Body lists per-bundle pricing."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Payment required
                  packs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: discovery-crawling
                        price:
                          type: object
                          properties:
                            amount:
                              type: string
                              example: "0.30"
                            currency:
                              type: string
                              example: USDC
                        ruleCount:
                          type: integer
                          example: 19
                  totalPrice:
                    type: object
                    properties:
                      amount:
                        type: string
                        example: "4.50"
                      currency:
                        type: string
                        example: USDC
